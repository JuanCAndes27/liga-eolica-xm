name: ✅ Validar modelos (Pull Request)

# Cada PR que agregue/modifique un modelo se prueba con datos sintéticos.
# Corre sin secretos ni permisos de escritura: seguro para forks de estudiantes.
on:
  pull_request:
    paths: ["modelos/**"]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest de 5 días con datos de juguete
        run: python -m liga.run_diario --demo --backtest 5
      - name: Resumen
        run: cat LEADERBOARD.md >> "$GITHUB_STEP_SUMMARY"
